<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttercup Games — Splunk MCP Chat</title>
<style>
  :root {
    --bg: #0c0f14;
    --panel: #161b22;
    --panel-alt: #1d232c;
    --border: #2a323d;
    --text: #e6e9ed;
    --text-dim: #8b96a5;
    --green: #65a637;
    --green-bright: #8dc63f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
  }
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    border-bottom: 3px solid var(--green);
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header .subtitle {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }
  header .titles { flex: 1; }
  #provider, #model {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-size: 0.82rem;
    max-width: 14rem;
  }
  #provider:focus, #model:focus {
    outline: none;
    border-color: var(--green-bright);
  }
  #log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    padding: 1rem;
    height: 58vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .msg {
    max-width: 85%;
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
    font-size: 0.92rem;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--green);
    color: #0c0f14;
    font-weight: 500;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }
  .msg.pending {
    align-self: flex-start;
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.85rem;
  }
  .msg .label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.65;
    margin-bottom: 0.2rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 0.75rem;
  }
  input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.6rem 1rem;
    font-size: 0.92rem;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--green-bright);
    box-shadow: 0 0 0 2px rgba(141, 198, 63, 0.25);
  }
  button {
    background: var(--green);
    color: #0c0f14;
    border: none;
    border-radius: 999px;
    padding: 0.6rem 1.3rem;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--green-bright); }
  button:disabled,
  input:disabled {
    opacity: 0.55;
    cursor: default;
  }
  button:disabled:hover { background: var(--green); }
  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 0.75rem;
  }
</style>
</head>
<body>

<header>
  <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="30" fill="#0c0f14" stroke="#2a323d"/>
    <g transform="translate(32,34)">
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(0)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(72)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(144)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(216)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(288)"/>
      <circle r="5" fill="#8dc63f"/>
    </g>
    <path d="M32 44 L32 58" stroke="#65a637" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 52 L26 56" stroke="#65a637" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="titles">
    <h1>Buttercup Games — AI Ops Assistant</h1>
    <div class="subtitle">Splunk MCP &middot; splunk-mcp-with-agent-observability</div>
  </div>
  <select id="provider" title="LLM provider" disabled>
    <option>Loading...</option>
  </select>
  <select id="model" title="OpenAI-spec model" hidden disabled></select>
</header>

<div id="log"></div>
<form id="chat-form">
  <input id="message" type="text" maxlength="4000" placeholder="Search> any high severity notables in the last 30 days?" autocomplete="off" required>
  <button id="submit" type="submit" disabled>Search</button>
</form>
<footer>Answers are grounded in live Splunk data via MCP, traced to Splunk Observability Cloud.</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const submitButton = document.getElementById("submit");
const providerSelect = document.getElementById("provider");
const modelSelect = document.getElementById("model");
const conversationId = crypto.randomUUID(); // one session per page load

const PROVIDER_LABELS = {
  anthropic: "Anthropic",
  openai: "OpenAI",
  gemini: "Gemini",
  "openai-spec": "OpenAI spec",
};

function showModelList(provider) {
  const show = provider === "openai-spec" && modelSelect.options.length > 0;
  modelSelect.hidden = !show;
  modelSelect.disabled = !show;
}

async function errorDetail(response) {
  let detail = `Server returned ${response.status}`;
  try {
    const body = await response.json();
    if (typeof body.detail === "string" && body.detail) {
      detail = body.detail;
    } else if (Array.isArray(body.detail)) {
      const parts = body.detail.map((item) => item.msg).filter(Boolean);
      if (parts.length) detail = parts.join("; ");
    }
  } catch (_err) {
    // Response body was not JSON.
  }
  return detail;
}

async function loadProviders() {
  try {
    const response = await fetch("/config");
    if (!response.ok) throw new Error(await errorDetail(response));
    const { providers, default_provider, openai_spec_models, o11y_configured } = await response.json();
    if (!o11y_configured) {
      addMessage("assistant", "Observability Cloud is not configured in .env");
      return;
    }
    providerSelect.innerHTML = "";
    for (const provider of providers) {
      const option = document.createElement("option");
      option.value = provider;
      option.textContent = PROVIDER_LABELS[provider] || provider;
      if (provider === default_provider) option.selected = true;
      providerSelect.appendChild(option);
    }
    modelSelect.innerHTML = "";
    for (const model of openai_spec_models || []) {
      const option = document.createElement("option");
      option.value = model;
      option.textContent = model;
      modelSelect.appendChild(option);
    }
    providerSelect.disabled = false;
    providerSelect.addEventListener("change", () => showModelList(providerSelect.value));
    showModelList(providerSelect.value);
    submitButton.disabled = false;
  } catch (err) {
    providerSelect.innerHTML = '<option value="">unavailable</option>';
    addMessage("assistant", `Could not load configured LLM providers: ${err.message}`);
  }
}
loadProviders();

async function readChatStream(response, pending) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let reply = "";
  while (true) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    const chunks = buffer.split("\n\n");
    buffer = chunks.pop() || "";
    for (const chunk of chunks) {
      const line = chunk.split("\n").find((item) => item.startsWith("data: "));
      if (!line) continue;
      const event = JSON.parse(line.slice(6));
      if (event.phase === "tool") pending.textContent = "Searching Splunk...";
      else if (event.phase === "model") pending.textContent = "Noodling...";
      else if (event.phase === "done") reply = event.reply || "";
      else if (event.phase === "error") throw new Error(event.detail || "The request failed.");
    }
    if (done) break;
  }
  if (!reply) throw new Error("The response ended before an answer.");
  return reply;
}

function addMessage(role, text) {
  const wrapper = document.createElement("div");
  wrapper.className = "msg " + role;
  if (role !== "pending") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Buttercup Assistant";
    wrapper.appendChild(label);
  }
  wrapper.appendChild(document.createTextNode(text));
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return wrapper;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";
  input.disabled = true;
  submitButton.disabled = true;
  const pending = addMessage("pending", "Noodling...");

  try {
    const response = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        conversation_id: conversationId,
        provider: providerSelect.value || null,
        model: modelSelect.hidden ? null : modelSelect.value,
      }),
    });
    if (!response.ok) throw new Error(await errorDetail(response));
    const reply = await readChatStream(response, pending);
    pending.remove();
    addMessage("assistant", reply);
  } catch (err) {
    pending.remove();
    addMessage("assistant", `Error: ${err.message}`);
  } finally {
    input.disabled = false;
    submitButton.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
